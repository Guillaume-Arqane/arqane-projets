<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Espace projet ARQANE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE : un espace de mission sobre, celui d'un cabinet qui rend des comptes.
   IDEA : le classeur de projet, avec ses onglets, ouvert sur la carte du parc.
   PICTURE : la carte des 59 déchèteries, interactive, en tête du tableau de bord.
   COLOUR and TYPE : charte ARQANE, bleu nuit, blanc cassé, anthracite, ambre en accent ; Montserrat et Inter.
   LAYOUT : barre latérale de navigation, contenu à droite ; une colonne et navigation horizontale sous 900px. */
:root{color-scheme:light dark;--bg:light-dark(#F4F5F3,#10151a);--panel:light-dark(#fff,#19212a);--ink:light-dark(#222629,#e8ecef);--mute:light-dark(#646b71,#9aa4ad);--line:light-dark(#dde2e6,#2b3540);--bn:#14324B;--bn2:light-dark(#14324B,#86abcb);--am:#C77F2C;--soft:light-dark(#e8eef3,#1f2c38)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,Calibri,Arial,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Montserrat,Calibri,Arial,sans-serif;line-height:1.15;margin:0 0 10px;color:var(--bn2)}
h1{font-size:clamp(26px,3.4vw,38px)}h2{font-size:22px;margin-top:6px}h3{font-size:17px;margin-top:18px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--am);outline-offset:2px}
a{color:var(--bn2)}
/* écran d'accès */
#gate{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
#gate .l{background:var(--bn);color:#fff;padding:clamp(28px,6vw,80px);display:flex;flex-direction:column;justify-content:space-between}
#gate .l h1{color:#fff;margin-top:24px}
#gate .r{display:grid;place-items:center;padding:28px}
.brand{font:700 18px Montserrat,Arial,sans-serif;letter-spacing:.06em}
.brand small{display:block;font:500 13px Inter,Arial,sans-serif;letter-spacing:0;opacity:.75}
form.code{width:min(380px,100%)}
form.code input{width:100%;min-height:52px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-size:18px;letter-spacing:.06em;margin:8px 0 12px}
.btn{min-height:46px;padding:0 18px;border-radius:9px;border:1px solid var(--bn2);background:var(--panel);color:var(--bn2);font-weight:600;cursor:pointer}
.btn.p{background:var(--bn);border-color:var(--bn);color:#fff}
.err{color:#b3261e;font-size:14px;min-height:22px}
.rings{opacity:.9}
/* application */
#app{display:none;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
nav.side{background:var(--bn);color:#fff;padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
nav.side .brand{padding:0 8px 16px}
nav.side button{text-align:left;min-height:44px;padding:0 12px;border:0;border-radius:8px;background:transparent;color:#d6e1ea;font-weight:600;cursor:pointer}
nav.side button[aria-current=true]{background:#ffffff1a;color:#fff;box-shadow:inset 3px 0 0 var(--am)}
nav.side .sp{flex:1}
nav.side .who{font-size:12px;opacity:.75;padding:0 12px 8px}
main{padding:clamp(18px,3vw,40px);max-width:1240px;width:100%}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:12px;margin:14px 0}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi b{display:block;font:700 clamp(22px,2.6vw,30px) Montserrat,Arial,sans-serif;color:var(--bn2);white-space:nowrap}
.kpi span{font-size:13px;color:var(--mute)}
.kpi.warn b{color:var(--am)}
.bar{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--soft);margin:6px 0}
.bar i{display:block;height:100%}
.leg{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;margin:8px 0 4px}
.leg span::before{content:"";display:inline-block;width:11px;height:11px;border-radius:3px;background:var(--c);margin-right:7px;vertical-align:-1px}
.etp{display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr) 64px;gap:12px;align-items:center;margin:10px 0;font-size:14px}
.etp .bar{margin:0;height:12px}.etp b{text-align:right;font-variant-numeric:tabular-nums}
@media(max-width:600px){.etp{grid-template-columns:minmax(0,1fr) 56px}.etp .bar{grid-column:1/-1;grid-row:2}}
.two{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px}
.lead{font-size:17px;max-width:70ch}
.note{font-size:13px;color:var(--mute)}
.md{max-width:82ch}.md table{font-size:14px}
table{border-collapse:collapse;width:100%}
th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:14px}
th{font-size:12px;color:var(--mute);font-weight:600}
.scroll{overflow-x:auto}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
.chips button{min-height:38px;padding:0 12px;border-radius:19px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:14px}
.chips button[aria-pressed=true]{background:var(--bn);border-color:var(--bn);color:#fff}
.fig{position:relative;min-height:430px}.fig svg{position:absolute;inset:0;width:100%;height:100%}
.dot{cursor:pointer;transition:r .15s}
.pill{display:inline-block;padding:1px 9px;border-radius:10px;font-size:12px;font-weight:600;white-space:nowrap}
.check label{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
.check input{width:22px;height:22px;flex:none;margin-top:1px;accent-color:#14324B}
.check label.done span{text-decoration:line-through;color:var(--mute)}
.doc{display:flex;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.doc .ic{flex:none;width:46px;height:54px;border-radius:6px;display:grid;place-items:center;font:700 11px Montserrat,Arial;color:#fff;background:var(--bn)}
.doc .ic.pdf{background:#b3261e}.doc .ic.xlsx{background:#2f7d5b}.doc .ic.html{background:var(--am)}
.doc div{flex:1}.doc b{display:block}
.gantt div.r{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px;align-items:center;margin:6px 0;font-size:14px}
.gantt .tr{position:relative;height:26px;background:var(--soft);border-radius:5px}
.gantt .tr i{position:absolute;top:0;bottom:0;border-radius:5px}
.gantt .ax{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px;font-size:12px;color:var(--mute)}
.gantt .ax div:last-child{display:flex;justify-content:space-between}
.side-panel{border-left:4px solid var(--am)}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;background:var(--soft);color:var(--bn2);font-weight:600}
button.sortb{all:unset;cursor:pointer;font:600 12px Inter,Arial,sans-serif;color:var(--mute)}button.sortb:focus-visible{outline:2px solid var(--am)}
.pil input,.pil select{min-height:40px;padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:var(--panel);font-size:15px;width:100%}
input.s,select.s{min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:9px;background:var(--panel);width:min(320px,100%)}
@media(max-width:900px){#gate{grid-template-columns:1fr}#gate .l{min-height:auto}#app{grid-template-columns:1fr}nav.side{position:sticky;height:auto;flex-direction:row;overflow-x:auto;padding:8px;z-index:5}nav.side .brand,nav.side .who,nav.side .sp{display:none}nav.side button{flex:none}.two{grid-template-columns:1fr}.fig{min-height:340px}}
@media(max-width:600px){table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;color:var(--mute)}.stack td:empty{display:none}.gantt div.r,.gantt .ax{grid-template-columns:90px minmax(0,1fr)}}
@media(prefers-reduced-motion:reduce){.dot{transition:none}}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>
</head>
<body>
<section id="gate">
 <div class="l"><div class="brand">ARQANE<small>Cabinet de conseil et d'assistance à maîtrise d'ouvrage</small></div>
  <div><h1>Audit des 59 déchèteries métropolitaines et plan pluriannuel d'investissement</h1><p class="lead" style="opacity:.85">Espace projet sécurisé. Le contenu est chiffré : il ne s'affiche qu'avec un code d'accès valide.</p></div>
  <svg class="rings" width="120" height="72" viewBox="0 0 120 72" aria-hidden="true"><circle cx="36" cy="36" r="34" fill="none" stroke="#C77F2C" stroke-width="2"/><circle cx="92" cy="47" r="23" fill="none" stroke="#fff" stroke-width="2"/><circle cx="110" cy="27" r="10" fill="none" stroke="#fff" stroke-width="2"/></svg></div>
 <div class="r"><form class="code" id="fCode" autocomplete="off"><h2>Code d'accès</h2><label for="iCode" class="note">Saisir le code transmis par ARQANE</label><input id="iCode" type="password" autocomplete="off" spellcheck="false"><div class="err" id="eCode" role="alert"></div><button class="btn p" type="submit" id="bGo" style="width:100%">Ouvrir l'espace</button><p class="note" style="margin-top:14px">Contact : g.jaubert@arqane.fr</p></form></div>
</section>
<section id="app"><nav class="side" id="nav"></nav><main id="main"></main></section>

let D=null,KEY=null,view="",filt={t:0,q:""},sel=null;
async function derive(code,salt,it){const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(code.trim()),"PBKDF2",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(salt),iterations:it,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}
async function open(code){for(const v of VAULT){try{const key=await derive(code,v.salt,v.it);const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(v.iv)},key,b64(v.ct));return[JSON.parse(new TextDecoder().decode(pt)),key]}catch(e){}}return[null,null]}
$("#fCode").addEventListener("submit",async e=>{e.preventDefault();$("#eCode").textContent="";$("#bGo").disabled=true;$("#bGo").textContent="Vérification…";
 if(!window.crypto||!crypto.subtle){$("#eCode").textContent="Ce navigateur ne permet pas le déchiffrement (page à ouvrir en https).";$("#bGo").disabled=false;$("#bGo").textContent="Ouvrir l'espace";return}
 const[d,k]=await open($("#iCode").value);$("#bGo").disabled=false;$("#bGo").textContent="Ouvrir l'espace";
 if(!d){$("#eCode").textContent="Code non reconnu.";return}D=d;KEY=k;await loadState();$("#iCode").value="";$("#gate").style.display="none";$("#app").style.display="grid";go(location.hash.slice(1)||D.views[0][0])});
function go(v){if(!D.views.some(x=>x[0]===v))v=D.views[0][0];view=v;sel=null;
 $("#nav").innerHTML=`<div class="brand">ARQANE<small>${esc(D.space)}</small></div>${D.views.map(([k,l])=>`<button data-v="${k}" aria-current="${k===v}">${l}</button>`).join("")}<div class="sp"></div><div class="who">${esc(D.updated)}</div><button data-out="1">Se déconnecter</button>`;
 try{history.replaceState(null,"","#"+v)}catch(e){}render();window.scrollTo(0,0)}

const TC=["#14324B","#C77F2C","#4A6B85","#8A5A1F","#8FA9BF","#7A7F84"];
function mapCard(){const S=D.sites,tours=D.tours;return`<div class="card"><div class="two"><div><h2>Le parc : 59 déchèteries</h2><div class="chips" id="chT"><button data-t="0" aria-pressed="${filt.t==0}">Toutes</button>${tours.map((t,i)=>`<button data-t="${i+1}" aria-pressed="${filt.t==i+1}">Tournée ${i+1}</button>`).join("")}</div>
<div class="fig" id="map"><svg id="svgMap" role="img" aria-label="Carte des déchèteries"></svg></div><p class="note">Couleur = tournée d'audit prévisionnelle. Toucher un point pour ouvrir la fiche du site.</p></div>
<div id="sitePanel">${sitePanel()}</div></div></div>`}
function sitePanel(){const s=D.sites.find(x=>x.n===sel);if(!s){const t=filt.t?D.tours[filt.t-1]:null;const L=D.sites.filter(x=>!filt.t||x.tour===filt.t);
 return`<div class="card side-panel"><h3 style="margin-top:0">${t?"Tournée "+filt.t+" · "+esc(t.nom):"Toutes les tournées"}</h3>${t?`<p class="note">${esc(t.per)}</p>`:""}<p>${L.length} sites · ${Math.round(L.reduce((a,x)=>a+x.ton,0)).toLocaleString("fr-FR")} t reçues en 2024</p><table><tr><th>Statut</th><th>Sites</th></tr>${Object.entries(L.reduce((m,x)=>(m[x.statut]=(m[x.statut]||0)+1,m),{})).map(([k,n])=>`<tr><td>${esc(k)}</td><td>${n}</td></tr>`).join("")}</table></div>`}
 return`<div class="card side-panel"><span class="tag">Site n° ${s.n} · tournée ${s.tour}</span><h3>${esc(s.nom)}</h3><table>${[["Commune",s.commune],["Ancien territoire",s.terr],["Régime ICPE",s.regime],["Catégorie",s.cat],["Tonnage 2024",Math.round(s.ton).toLocaleString("fr-FR")+" t"],["Superficie",s.surf],["Gestion haut / bas de quai",s.gestion],["Statut de l'audit",s.statut],["Date de visite",s.date?new Date(s.date).toLocaleDateString("fr-FR"):"À planifier"],["Période prévisionnelle",D.tours[s.tour-1].per]].map(r=>`<tr><td class="note">${r[0]}</td><td>${esc(r[1])}</td></tr>`).join("")}</table>${s.note?`<p class="note">${esc(s.note)}</p>`:""}<button class="btn" data-sel="0">Fermer la fiche</button></div>`}
function drawMap(){const svg=$("#svgMap");if(!svg)return;const W=svg.clientWidth,H=svg.clientHeight;const x0=4.66,x1=5.86,y0=43.13,y1=43.78;const k=Math.min(W/((x1-x0)*0.725),H/(y1-y0));const ox=(W-(x1-x0)*0.725*k)/2,oy=(H-(y1-y0)*k)/2;
 const P=(lon,lat)=>[ox+(lon-x0)*0.725*k,oy+(y1-lat)*k];
 svg.innerHTML=D.geo.map(r=>`<polygon points="${r.map(p=>P(p[0],p[1]).join(",")).join(" ")}" fill="var(--soft)" stroke="var(--line)" stroke-width=".7"/>`).join("")+
 D.sites.map(s=>{const[x,y]=P(s.lon,s.lat),on=!filt.t||s.tour===filt.t;return`<circle class="dot" data-sel="${s.n}" cx="${x}" cy="${y}" r="${s.n===sel?9:W<520?5:6.5}" fill="${TC[s.tour-1]}" stroke="#fff" stroke-width="1.5" opacity="${on?1:.18}"><title>${esc(s.nom)}</title></circle>`}).join("")}
let ro;function mapInit(){if(ro)ro.disconnect();const m=$("#map");if(m){ro=new ResizeObserver(drawMap);ro.observe(m)}}
const COLS=[["n","N°"],["nom","Déchèterie"],["commune","Commune"],["terr","Territoire"],["regime","Régime"],["ton","Tonnage 2024"],["tour","Tournée"],["statut","Statut"]];
function sitesTable(){const q=filt.q.toLowerCase();const so=filt.so||["n",1];const L=D.sites.filter(s=>(!filt.t||s.tour===filt.t)&&(!q||(s.nom+s.commune+s.terr).toLowerCase().includes(q))).sort((a,b)=>{const x=a[so[0]],y=b[so[0]];return (typeof x==="number"?x-y:String(x).localeCompare(String(y),"fr"))*so[1]||a.n-b.n});
 return`<div class="card"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center"><h2>Liste des sites</h2><div style="display:flex;gap:8px;flex-wrap:wrap"><select class="s" id="sortS" aria-label="Trier par" style="width:auto">${COLS.flatMap(([k,l])=>[[k,1,l+" (croissant)"],[k,-1,l+" (décroissant)"]]).map(([k,d,l])=>`<option value="${k}|${d}" ${so[0]===k&&so[1]===d?"selected":""}>Trier : ${l}</option>`).join("")}</select><input class="s" id="qS" placeholder="Rechercher un site ou une commune" value="${esc(filt.q)}"></div></div><p class="note">Toucher un titre de colonne pour trier, une seconde fois pour inverser.</p><div class="scroll"><table class="stack"><thead><tr>${COLS.map(([k,l])=>`<th><button class="sortb" data-so="${k}" aria-sort="${so[0]===k?(so[1]>0?"ascending":"descending"):"none"}">${l}${so[0]===k?(so[1]>0?" ▲":" ▼"):""}</button></th>`).join("")}</tr></thead><tbody>${L.map(s=>`<tr><td>${s.n}</td><td><a href="#${view}" data-sel="${s.n}">${esc(s.nom)}</a></td><td>${esc(s.commune)}</td><td>${esc(s.terr)}</td><td>${esc(s.regime)}</td><td style="white-space:nowrap;text-align:right">${Math.round(s.ton).toLocaleString("fr-FR")} t</td><td><span class="pill" style="background:${TC[s.tour-1]};color:#fff">T${s.tour}</span></td><td>${esc(s.statut)}</td></tr>`).join("")}</tbody></table></div></div>`}

function gantt(){const a=new Date(D.plan.from),b=new Date(D.plan.to),span=b-a,pc=d=>Math.max(0,Math.min(100,100*(new Date(d)-a)/span));const today=pc(new Date());
 return`<div class="card gantt"><h2>Planning prévisionnel</h2><p class="note">${esc(D.plan.note)}</p>${D.plan.rows.map(r=>`<div class="r"><span>${esc(r[0])}</span><div class="tr"><i style="left:${pc(r[1])}%;width:${pc(r[2])-pc(r[1])}%;background:${r[3]}" title="${esc(r[0])}"></i></div></div>`).join("")}
 <div class="ax"><span></span><div>${D.plan.ticks.map(t=>`<span>${t}</span>`).join("")}</div></div></div>`}

function docs(){const q=(filt.dq||"").toLowerCase();const cats=[...new Set(D.docs.map(d=>d.cat))];
 return`<div class="card"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center"><h2>Documents</h2><input class="s" id="qD" placeholder="Rechercher un document" value="${esc(filt.dq||"")}"></div>${cats.map(c=>{const L=D.docs.filter(d=>d.cat===c&&(!q||(d.name+d.desc).toLowerCase().includes(q)));return L.length?`<h3>${esc(c)}</h3>${L.map(d=>`<div class="doc"><span class="ic ${d.ext}">${d.ext.toUpperCase()}</span><div><b>${esc(d.name)}</b><span class="note">${esc(d.desc)} · ${(d.size/1024).toFixed(0)} Ko</span></div><button class="btn" data-dl="${d.file}">Télécharger</button></div>`).join("")}`:""}).join("")}<p class="note" id="mDl"></p></div>`}
async function dl(f){const d=D.docs.find(x=>x.file===f);$("#mDl").textContent="Déchiffrement de « "+d.name+" »…";
 try{const r=await fetch("d/"+f+".bin");if(!r.ok)throw 0;const buf=new Uint8Array(await r.arrayBuffer());const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:buf.slice(0,12)},KEY,buf.slice(12));
  const url=URL.createObjectURL(new Blob([pt],{type:d.mime}));const a=document.createElement("a");a.href=url;a.download=d.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);$("#mDl").textContent=""}
 catch(e){$("#mDl").textContent="Document indisponible : vérifier que le dossier « d » est bien en ligne à côté de la page."}}
/* ---------- check-list (mémorisée sur cet appareil) */
function checklist(){let st={};try{st=JSON.parse(localStorage.getItem("arq-ck-"+D.id)||"{}")}catch(e){}const n=D.check.filter((c,i)=>st[i]).length;
 return`<div class="card check"><h2>${esc(D.checkTitle)}</h2><p class="note">${n} sur ${D.check.length} faits · coché sur cet appareil</p>${D.check.map((c,i)=>`<label class="${st[i]?"done":""}"><input type="checkbox" data-ck="${i}" ${st[i]?"checked":""}><span>${esc(c)}</span></label>`).join("")}</div>`}
/* ---------- état modifiable (planning, livrables, statuts) */
async function loadState(){try{const r=await fetch("d/"+D.stateFile+".bin",{cache:"no-store"});if(!r.ok)return;const buf=new Uint8Array(await r.arrayBuffer());const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:buf.slice(0,12)},KEY,buf.slice(12));applyState(JSON.parse(new TextDecoder().decode(pt)))}catch(e){}}
function applyState(st){if(st.plan)D.plan.rows=st.plan;if(st.liv)D.liv=st.liv;if(st.sites)D.sites.forEach(s=>{const x=st.sites[s.n];if(x){s.statut=x.statut;s.date=x.date||""}});if(st.updated)D.updated="Mis à jour le "+st.updated}
function getState(){return{plan:D.plan.rows,liv:D.liv,sites:Object.fromEntries(D.sites.map(s=>[s.n,{statut:s.statut,date:s.date||""}])),updated:new Date().toLocaleDateString("fr-FR")}}
async function encFile(key,obj){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},key,new TextEncoder().encode(JSON.stringify(obj))));const o=new Uint8Array(12+ct.length);o.set(iv);o.set(ct,12);return o}
function save(name,bytes){const u=URL.createObjectURL(new Blob([bytes],{type:"application/octet-stream"}));const a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
async function publish(){const st=getState();const kc=await crypto.subtle.importKey("raw",b64(D.ck),"AES-GCM",false,["encrypt"]);
 save("etat_i.bin",await encFile(KEY,st));setTimeout(async()=>save("etat_c.bin",await encFile(kc,st)),700);D.updated="Mis à jour le "+st.updated;
 $("#mPub").textContent="Deux fichiers téléchargés : etat_i.bin et etat_c.bin. Les déposer dans le dossier d du dépôt GitHub, à la place des anciens."}
const STL=["À venir","En cours","Remis","Validé"],STS=["Prévu","En cours","Audité","Rapport remis","Validé"];
/* ---------- avancement (lu dans le fichier d'état) */
const STC={"Prévu":"var(--line)","En cours":"#C77F2C","Audité":"#8FA9BF","Rapport remis":"#4A6B85","Validé":"#2f7d5b"};
function avct(){const S=D.sites,n=S.length,c=k=>S.filter(s=>s.statut===k).length,enc=c("En cours"),val=c("Validé"),rap=c("Rapport remis")+val,fait=c("Audité")+rap;
 const L=D.liv,ok=l=>l.st==="Remis"||l.st==="Validé",ld=L.filter(ok).length,nx=L.find(l=>!ok(l));
 const now=new Date().toISOString().slice(0,10),R=D.plan.rows;let cur=null;R.forEach(r=>{if(now>=r[1])cur=r});
 let et="À venir",es="lancement de la mission";if(cur){const m=/^Tournée (\d)/.exec(cur[0]);if(m){et="Étape 2";es="audits, tournée "+m[1]}else{const e=/^Étape (\d) · (.*)/.exec(cur[0]);if(e){et="Étape "+e[1];es=e[2]}else{et=cur[0];es=""}}if(now>R[R.length-1][2]){et="Terminée";es="toutes les étapes"}}
 const pct=(a,b)=>b?Math.round(100*a/b):0,ET=[["1","Préparation méthodologique"],["2","Audits des déchèteries"],["3","Diagnostic comparatif"],["4","Plan pluriannuel d'investissement"]];
 const row=(lab,a,b)=>`<div class="etp"><span>${esc(lab)}</span><div class="bar"><i style="width:${pct(a,b)}%;background:var(--bn2)"></i></div><b>${a} / ${b}</b></div>`;
 return kpis([[fait+" / "+n,"sites audités"],[String(enc),"sites en cours d'audit"],[rap+" / "+n,"rapports remis"],[String(val),"rapports validés"],[ld+" / "+L.length,"livrables remis"],[et,es]])+
 `<div class="card"><h2>Avancement des audits</h2><div class="bar" role="img" aria-label="${STS.map(k=>k+" "+c(k)).join(", ")}">${STS.map(k=>c(k)?`<i style="width:${100*c(k)/n}%;background:${STC[k]}" title="${k} : ${c(k)}"></i>`:"").join("")}</div>
 <div class="leg">${STS.map(k=>`<span style="--c:${STC[k]}">${k} <b>${c(k)}</b></span>`).join("")}</div>
 <h3>Par étape</h3>${ET.map(([e,lab])=>e==="2"?row("2 · "+lab+" (rapports)",rap,n):row(e+" · "+lab,L.filter(l=>l.e===e&&ok(l)).length,L.filter(l=>l.e===e).length)).join("")}
 <p class="note">${nx?`Prochain livrable : ${esc(nx.l)}, prévu ${esc(nx.sem)}.`:"Tous les livrables sont remis."} ${esc(D.updated)}. Interlocuteur unique : Guillaume Jaubert, g.jaubert@arqane.fr</p></div>`}
function livTable(){return`<div class="card"><h2>Livrables</h2><div class="scroll"><table class="stack"><thead><tr><th>Étape</th><th>Livrable</th><th>Date prévisionnelle</th><th>Statut</th></tr></thead><tbody>${D.liv.map(l=>`<tr><td>${esc(l.e)}</td><td>${esc(l.l)}</td><td style="white-space:nowrap">${esc(l.sem)}</td><td>${esc(l.st)}</td></tr>`).join("")}</tbody></table></div><p class="note">Dates prévisionnelles, en semaines.</p></div>`}
function pilot(){return`<div class="card pil"><h2>Planning</h2><div class="scroll"><table><tr><th>Ligne</th><th>Début</th><th>Fin</th></tr>${D.plan.rows.map((r,i)=>`<tr><td><input data-pl="${i}|0" value="${esc(r[0])}"></td><td><input type="date" data-pl="${i}|1" value="${r[1]}"></td><td><input type="date" data-pl="${i}|2" value="${r[2]}"></td></tr>`).join("")}</table></div></div>
<div class="card pil"><h2>Livrables</h2><div class="scroll"><table><tr><th>Étape</th><th>Livrable</th><th>Semaine prévisionnelle</th><th>Statut</th></tr>${D.liv.map((l,i)=>`<tr><td>${esc(l.e)}</td><td>${esc(l.l)}</td><td><input data-lv="${i}|sem" value="${esc(l.sem)}" placeholder="S22 2027"></td><td><select data-lv="${i}|st">${STL.map(x=>`<option ${x===l.st?"selected":""}>${x}</option>`).join("")}</select></td></tr>`).join("")}</table></div></div>
<div class="card pil"><h2>Statut des sites</h2><div class="scroll"><table><tr><th>N°</th><th>Déchèterie</th><th>Tournée</th><th>Statut</th><th>Date de visite</th></tr>${[...D.sites].sort((a,b)=>a.tour-b.tour||a.n-b.n).map(s=>`<tr><td>${s.n}</td><td>${esc(s.nom)}</td><td>T${s.tour}</td><td><select data-st="${s.n}|statut">${STS.map(x=>`<option ${x===s.statut?"selected":""}>${x}</option>`).join("")}</select></td><td><input type="date" data-st="${s.n}|date" value="${s.date||""}"></td></tr>`).join("")}</table></div></div>
<div class="card" style="position:sticky;bottom:10px;border-color:var(--am)"><h3 style="margin-top:0">Publier les modifications</h3><p class="note">Les changements s'affichent tout de suite ici. Pour les publier dans les deux espaces, générer les fichiers puis les déposer sur GitHub.</p><button class="btn p" data-pub="1">Générer les fichiers de mise à jour</button><p class="note" id="mPub"></p></div>`}
/* ---------- vues */
function render(){let V=D.pages[view]||{};let h="";if(view==="accueil"&&D.sites)V={...V,kpis:null,blocks:["avct",...(V.blocks||[]).filter(b=>!/^<h2>(Votre interlocuteur|Quatre étapes)/.test(b))]};
 if(V.title)h+=`<h1>${esc(V.title)}</h1>`;if(V.lead)h+=`<p class="lead">${esc(V.lead)}</p>`;
 if(V.kpis)h+=kpis(V.kpis.map(k=>k[3]==="days"?[days(k[0])>=0?days(k[0])+" j":"Échu",k[1],k[2]]:k));
 (V.blocks||[]).forEach(b=>{if(b==="avct")h+=avct();else if(b==="map")h+=mapCard();else if(b==="sites")h+=sitesTable();else if(b==="gantt")h+=gantt();else if(b==="docs")h+=docs();else if(b==="check")h+=checklist();else if(b==="liv")h+=livTable();else if(b==="pilot")h+=pilot();else h+=`<div class="card md">${b}</div>`});
 $("#main").innerHTML=h;mapInit()}
document.addEventListener("click",e=>{const t=e.target.closest("[data-v],[data-out],[data-t],[data-sel],[data-dl]");if(t&&t.closest(".pil"))return;if(!t)return;const d=t.dataset;
 if(d.v)go(d.v);else if(d.out){D=null;KEY=null;$("#main").innerHTML="";$("#app").style.display="none";$("#gate").style.display="grid";try{history.replaceState(null,"","#")}catch(er){}}
 else if(d.t!==undefined){filt.t=+d.t;sel=null;render()}else if(d.sel!==undefined){e.preventDefault();sel=+d.sel||null;render();if(sel)$("#sitePanel").scrollIntoView({block:"nearest"})}
 else if(d.dl)dl(d.dl)});
document.addEventListener("click",e=>{const t=e.target.closest("[data-so],[data-pub]");if(!t)return;if(t.dataset.so){const k=t.dataset.so,so=filt.so||["n",1];filt.so=[k,so[0]===k?-so[1]:1];render()}else publish()});
document.addEventListener("input",e=>{if(e.target.id==="qS"){filt.q=e.target.value;const p=e.target.selectionStart;render();const i=$("#qS");i.focus();i.setSelectionRange(p,p)}
 else if(e.target.id==="qD"){filt.dq=e.target.value;const p=e.target.selectionStart;render();const i=$("#qD");i.focus();i.setSelectionRange(p,p)}});
document.addEventListener("change",e=>{if(e.target.dataset.ck!==undefined){let st={};try{st=JSON.parse(localStorage.getItem("arq-ck-"+D.id)||"{}")}catch(er){}st[e.target.dataset.ck]=e.target.checked;try{localStorage.setItem("arq-ck-"+D.id,JSON.stringify(st))}catch(er){}render()}});
document.addEventListener("change",e=>{const d=e.target.dataset,v=e.target.value;if(e.target.id==="sortS"){const[k,dir]=v.split("|");filt.so=[k,+dir];render()}
 else if(d.pl){const[i,j]=d.pl.split("|");D.plan.rows[i][j]=v}else if(d.lv){const[i,k]=d.lv.split("|");D.liv[i][k]=v}else if(d.st){const[n,k]=d.st.split("|");D.sites.find(x=>x.n==n)[k]=v}});
addEventListener("hashchange",()=>{if(D)go(location.hash.slice(1))});
}
</script>
</body>
</html>
